
# La Sierra de Francia
# Despliegue automático con GitHub Pages

name: Publicar La Sierra de Francia

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Construir y publicar
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Compilar sitio Jekyll
        run: |
          bundle exec jekyll build \
            --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Auditoría SEO e IA (informativa)
        continue-on-error: true
        run: python3 _gestion/validar_sitio.py _site

      - name: Subir archivos generados
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
